version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: elyra_postgres
    restart: always
    environment:
      POSTGRES_USER: elyra
      POSTGRES_PASSWORD: elyra_password
      POSTGRES_DB: elyra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyra -d elyra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
